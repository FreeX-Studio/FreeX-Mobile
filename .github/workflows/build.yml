# Builds FreeX Mobile: the Android APK and the iOS app (unsigned, for your own signing). On a tag v*,
# both are attached to a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, version and translations
        run: |
          npm install --no-save acorn@8
          node tools/check-web.js

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FREEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/freex.jks"
            echo "FREEX_KEYSTORE=$RUNNER_TEMP/freex.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          FREEX_KEYSTORE_PASSWORD: ${{ secrets.FREEX_KEYSTORE_PASSWORD }}
          FREEX_KEY_ALIAS: ${{ secrets.FREEX_KEY_ALIAS }}
          FREEX_KEY_PASSWORD: ${{ secrets.FREEX_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            # the compiler's messages as annotations, readable without the log
            grep -E '^e: |error:|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/build.log" | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Collect
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' web/version.json)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FreeX-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: freex-android
          path: dist/*.apk

  ios:
    name: iOS
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Build (simulator and unsigned device build)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -version
          for sdk in iphonesimulator iphoneos; do
            xcodebuild -project FreeX.xcodeproj -scheme FreeX -configuration Release -sdk $sdk \
              -derivedDataPath "$RUNNER_TEMP/dd-$sdk" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee "$RUNNER_TEMP/build-$sdk.log" | grep -E 'error|warning: .*FreeX/|BUILD' || true
            if ! grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/build-$sdk.log"; then
              grep -E 'error:' -A2 "$RUNNER_TEMP/build-$sdk.log" | head -40 | sed 's/^/::error::/'
              exit 1
            fi
          done
      - name: Collect
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' web/version.json)
          APP="$RUNNER_TEMP/dd-iphoneos/Build/Products/Release-iphoneos/FreeX.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          test -f "$APP/web/index.html"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qr "FreeX-iOS-$VERSION-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: freex-ios
          path: dist/*.ipa

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
